[pytest]
testpaths = strategies ai-service/tests practice/tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --cov=ai-service/app --cov=strategies --cov=practice.economics --cov=practice.report --cov=practice.presentation --cov=practice.run --cov-report=term-missing --cov-fail-under=80
